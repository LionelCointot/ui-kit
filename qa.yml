# Contrat d'intégration avec qa-platform : `qa run <chemin du repo> --data <dossier>`.
# Les commandes sont celles de CLAUDE.md et des scripts npm (ng test, node --test), avec rapports JUnit / LCOV.
# Pas encore de suite Storybook / Playwright visuelle ni de lint (voir CLAUDE.md) : à déclarer quand elles existeront.
version: 1
project:
  name: ui-kit
  description: Bibliothèque de composants Angular (ui-angular) et design tokens (ui-tokens)
setup:
  - id: npm-ci
    name: Installation des dépendances (npm ci)
    run: npm ci
    cache-key: [package-lock.json]

suites:
  - id: angular-unit
    name: Composants Angular ui-angular (Vitest via ng test)
    kind: unit
    tools: [angular, vitest]
    # Le builder `unit-test` n'a pas d'option pour le dossier du rapport de couverture (défaut : coverage/<projet>
    # dans le repo) : un fichier de configuration Vitest minimal, écrit dans $QA_REPORTS_DIR, le redirige.
    run: |
      printf 'export default { test: { coverage: { reportsDirectory: "%s/coverage" } } };\n' "$QA_REPORTS_DIR" > "$QA_REPORTS_DIR/vitest-qa.config.mjs"
      npx ng test ui-angular --watch=false \
        --reporters=default --reporters=junit \
        --output-file="$QA_REPORTS_DIR/junit.xml" \
        --coverage --coverage-reporters=lcovonly \
        --coverage-include="packages/angular/**/*.ts" \
        --coverage-exclude="**/*.spec.ts" --coverage-exclude="**/*.stories.ts" --coverage-exclude="**/testing/**" \
        --runner-config="$QA_REPORTS_DIR/vitest-qa.config.mjs"
    reports:
      tests:
        - { format: junit, path: junit.xml }
      coverage:
        - { format: lcov, path: coverage/lcov.info, component: angular, language: typescript }

  - id: tokens-unit
    name: Design tokens ui-tokens (node --test)
    kind: unit
    tools: [node-test]
    working-directory: packages/tokens
    run: >-
      node --test --experimental-test-coverage
      --test-reporter=spec --test-reporter-destination=stdout
      --test-reporter=junit --test-reporter-destination="$QA_REPORTS_DIR/junit.xml"
      --test-reporter=lcov --test-reporter-destination="$QA_REPORTS_DIR/lcov.info"
      "lib/*.test.mjs"
    reports:
      tests:
        - { format: junit, path: junit.xml }
      coverage:
        - { format: lcov, path: lcov.info, component: tokens, language: javascript }

coverage:
  exclude: ["**/*.test.mjs", "**/*.spec.ts", "**/*.stories.ts", "**/testing/**"]

policy:
  mode: enforce
  tests:
    minPassRate: 100
  # Seuils posés sous les mesures initiales (tokens 96 %, angular 93 % de lignes) ; maxDrop : pas de recul > 2 points.
  components:
    tokens:
      lines: { min: 90, maxDrop: 2 }
    angular:
      lines: { min: 88, maxDrop: 2 }
